Rules:
- pinyin: use tone marks (e.g. hǎo). pinyinnumbered: use numbers 1-4 for tones, 5 for neutral (e.g. hao3). Keep them consistent.
- Separate syllables with spaces. Remove apostrophes (xī'ān → xī ān).
- Apply tone sandhi (你好 → ní hǎo, not nǐ hǎo).
- Capitalize first letter in sentencepinyin only.
- For multiple pronunciations of the same meaning, use semicolons in pinyin and pinyinnumbered only (血: xuè; xiě).
- For distinct meanings, use pipes across pinyin, pinyinnumbered, definition, and partofspeech. Pipe counts must match across all four (行: xíng | háng).
- When a distinct meaning has multiple pronunciations, combine separators (解: jiě | jiè | xiè; jiě).
- Separate English synonyms within one meaning with semicolons (to open; to start; to drive).
- Use a simple, natural example sentence with the primary definition.
- For multi-character words, treat the word as a unit (长大 → zhǎng dà, not individual characters).
"""

