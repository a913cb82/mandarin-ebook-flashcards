[project]
name = "mandarin-ebook-flashcards"
version = "0.1.0"
description = "Generate Anki-ready flashcards from Chinese ebooks using Gemini."
authors = [{ name = "Alex B" }]
dependencies = [
    "ebooklib",
    "jieba",
    "pandas",
    "beautifulsoup4",
    "python-dotenv",
    "tomli",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-socket",
    "pytest-timeout",
    "ruff",
    "ty",
    "pre-commit",
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
extend-select = ["ANN", "PYI"]
ignore = []
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = []

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "error"

[tool.ty.environment]
python-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --disable-socket -m 'not manual'"
timeout = 5
pythonpath = ["src"]
markers = [
    "manual: marks tests that call real external services",
]
